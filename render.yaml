# Render blueprint (declarative service config) for ChatBoat.
#
# The load-bearing difference from the dashboard defaults is the BUILD COMMAND:
# it runs `python -m mf_rag.cli embed` at build time, so the Chroma index
# (chroma/ - gitignored because it is regenerable, P10) and the embedded
# all-MiniLM model cache are baked into the deploy image. Render free tier
# suspends instances and wipes their runtime filesystem on sleep, so an index
# built at boot is lost on every wake - and the next visitor pays a 30-90 s
# model re-download + re-embed with a blank page while it happens. An index
# built into the image survives sleep; the app-side bootstrap in app.py stays
# as a safety net for hosts whose build step skipped the embed.
#
# Create the service from this file:
#   Render dashboard -> New + -> Blueprint -> paste the repo URL
# (or Dashboard -> the service -> Edit -> paste the same values and Save &
# Deploy). Then set MF_RAG_GROQ_API_KEY in the service's Environment tab.
#
# PYTHON VERSION IS LOAD-BEARING. The whole pinned wheel set (tokenizers 0.20.3,
# chromadb 1.5.9, onnxruntime 1.30.0, ...) predates Python 3.14 and has no cp314
# wheels, so a 3.14 build falls back to compiling them from source - and Render
# mounts /usr/local/cargo read-only, so the Rust builds fail. The stack is built and
# tested on 3.12, so pin it here. If the service was created from the dashboard
# (not the blueprint), set the same version there: Settings -> Runtime -> Python
# Version -> 3.12. Keep this in sync with the local .venv.

services:
  - type: web
    name: nextleap-chatbot
    runtime: python
    pythonVersion: "3.12.0"
    plan: free
    buildCommand: >-
      bash -c "pip install torch --index-url https://download.pytorch.org/whl/cpu &&
      pip install -r requirements.txt &&
      python -m mf_rag.cli embed"
    startCommand: >-
      streamlit run app.py
      --server.port $PORT
      --server.address 0.0.0.0
      --server.headless true
      --server.enableCORS false
      --server.enableXsrfProtection false
    envVars:
      # Secret: set the value in the dashboard after the service exists.
      - key: MF_RAG_GROQ_API_KEY
        sync: false